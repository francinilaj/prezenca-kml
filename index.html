<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26301D">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prezenca">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Prezenca KML Mobile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: aplikacion me nje kolone per telefon – shirit i erret ulliri lart (si menuja e programit ne PC), lista ne mes, skeda poshte */
:root {
  --bg: #F1F3EC; --surface: #FFFFFF; --surface2: #E8ECE0; --ink: #1E231A; --muted: #646D5C; --line: #D8DDCF;
  --band: #26301D; --band-ink: #E8EEDB; --band-muted: #A9B79A;
  --olive: #4F6228; --olive-ink: #FFFFFF; --olive-soft: #E1E9D2; --khaki: #A4C06B;
  --ok: #2E7D32; --ok-soft: #DDEFD9; --warn: #B8650A; --warn-soft: #FDEBD3; --bad: #B3261E; --bad-soft: #FADFDA;
  --shadow: 0 1px 2px rgba(30, 36, 20, .08), 0 6px 20px rgba(30, 36, 20, .08);
  --f-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-head: "Barlow Semi Condensed", "Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12160E; --surface: #1B2015; --surface2: #252B1E; --ink: #E5E9DD; --muted: #9BA48F; --line: #313A27;
    --band: #0C0F09; --band-ink: #E5E9DD; --band-muted: #8E9C80;
    --olive: #93B35A; --olive-ink: #12160E; --olive-soft: #2B3520; --khaki: #A4C06B;
    --ok: #7CC47F; --ok-soft: #1E3220; --warn: #F0A54A; --warn-soft: #3A2B16; --bad: #F08A80; --bad-soft: #3D1E1A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12160E; --surface: #1B2015; --surface2: #252B1E; --ink: #E5E9DD; --muted: #9BA48F; --line: #313A27;
  --band: #0C0F09; --band-ink: #E5E9DD; --band-muted: #8E9C80;
  --olive: #93B35A; --olive-ink: #12160E; --olive-soft: #2B3520; --khaki: #A4C06B;
  --ok: #7CC47F; --ok-soft: #1E3220; --warn: #F0A54A; --warn-soft: #3A2B16; --bad: #F08A80; --bad-soft: #3D1E1A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--khaki); outline-offset: 2px; }
.num, .tab-num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.15; text-wrap: balance; margin: 0; }
.muted { color: var(--muted); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---- koka ---- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--band); color: var(--band-ink); }
.top .wrap { padding-block: 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.brandrow { display: flex; align-items: center; gap: 10px; }
.badge { font-family: var(--f-head); font-weight: 700; font-size: 13px; letter-spacing: .08em; background: var(--khaki); color: #1E2614; border-radius: 6px; padding: 3px 7px; }
.brand { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.brand b { font-family: var(--f-head); font-size: 19px; font-weight: 700; letter-spacing: .01em; }
.brand small { color: var(--band-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { background: transparent; border: 0; color: var(--band-ink); width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; }
.icon-btn:active { background: rgba(255, 255, 255, .08); }
.datebar { display: flex; align-items: center; gap: 6px; }
.datebar button { background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .12); color: var(--band-ink); height: 36px; min-width: 36px; border-radius: 9px; padding: 0 10px; }
.dlabel { flex: 1; position: relative; height: 36px; border-radius: 9px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12); display: flex; align-items: center; justify-content: center; font-weight: 600; overflow: hidden; }
.dlabel input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
.dlabel .past { color: var(--khaki); font-weight: 500; margin-left: 6px; font-size: 12px; }

/* ---- permbajtja ---- */
main { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
main .wrap { padding-block: 14px 8px; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.card h2 { font-size: 18px; }
.card h3 { font-size: 15px; letter-spacing: .02em; }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-title small { color: var(--muted); }
.eyebrow { font-family: var(--f-head); text-transform: uppercase; letter-spacing: .09em; font-size: 12px; color: var(--muted); font-weight: 600; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat .v { font-family: var(--f-head); font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
.stat.ok .v { color: var(--ok); } .stat.bad .v { color: var(--bad); }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--olive); color: var(--olive-ink); border-color: var(--olive); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; background: var(--surface2); color: var(--muted); }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.olive { background: var(--olive-soft); color: var(--olive); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }

.banner { border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; }
.banner.warn { background: var(--warn-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.banner.bad { background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
.banner.info { background: var(--olive-soft); border: 1px solid color-mix(in srgb, var(--olive) 30%, transparent); }
.banner b { font-weight: 600; }

.tools { display: flex; gap: 8px; align-items: center; }
.search { flex: 1; min-width: 0; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; }
.btn { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-weight: 600; white-space: nowrap; }
.btn.primary { background: var(--olive); color: var(--olive-ink); border-color: var(--olive); }
.btn.ghost { background: transparent; }
.btn.small { height: 32px; padding: 0 10px; font-size: 13px; }
.btn:disabled { opacity: .5; }

/* ---- lista ---- */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { width: 100%; display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; background: transparent; border: 0; border-bottom: 1px solid var(--line); text-align: left; }
.row:last-child { border-bottom: 0; }
.row:active { background: var(--surface2); }
.row .nr { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.row .who { min-width: 0; }
.row .who b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .who small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.changed { box-shadow: inset 3px 0 0 var(--khaki); }
.row.sel { background: var(--olive-soft); }
.row .check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line); display: inline-grid; place-items: center; }
.row.sel .check { background: var(--olive); border-color: var(--olive); }
.row.sel .check::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--olive-ink); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.st { --c: var(--ok); display: inline-flex; flex-direction: column; align-items: flex-end; gap: 1px; max-width: 46vw; }
.st span { border-radius: 8px; padding: 3px 9px; font-weight: 700; font-size: 13px; background: color-mix(in srgb, var(--c) 22%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.st.prez span { background: transparent; border-color: transparent; color: var(--ok); font-weight: 600; }
.st small { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.st small.late { color: var(--bad); font-weight: 700; }
.st small.soon { color: var(--warn); font-weight: 600; }
.group-h { padding: 8px 12px; background: var(--surface2); font-family: var(--f-head); font-weight: 600; font-size: 13px; letter-spacing: .03em; display: flex; justify-content: space-between; gap: 8px; }

.sendbar { position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 15; pointer-events: none; }
.sendbar .wrap { display: flex; justify-content: flex-end; padding-block: 0 8px; gap: 8px; }
.sendbar .btn { pointer-events: auto; box-shadow: var(--shadow); height: 46px; border-radius: 23px; padding: 0 18px; }

/* ---- tabela e raportit ---- */
.tbl-wrap { overflow-x: auto; margin: 0 -2px; }
table.rep { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.rep th, .rep td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: top; }
.rep th:first-child, .rep td:first-child { text-align: left; }
.rep thead th { font-family: var(--f-head); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.rep tr.zero td { color: var(--muted); }
.rep tr.tot td { font-weight: 700; background: var(--surface2); }
.rep td.names { text-align: left; font-size: 12px; color: var(--muted); padding-top: 0; }
.rep td b { font-weight: 700; }

.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.bar-row .lab { min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row .val { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.bar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 4px; }
.bar i.mid { background: #A0962A; } .bar i.low { background: var(--bad); } .bar i.amt { background: var(--warn); }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.kv .st { align-items: flex-start; }
.sheet-foot { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); margin: 0 -2px; padding: 10px 2px 4px; display: flex; flex-direction: column; gap: 10px; }
a.btn { display: inline-flex; align-items: center; text-decoration: none; color: inherit; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.tile .v { font-family: var(--f-head); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; overflow-wrap: anywhere; }
.tile .l { font-size: 12px; color: var(--muted); margin-top: 3px; }
.tile.warn .v { color: var(--warn); } .tile.ok .v { color: var(--ok); } .tile.bad .v { color: var(--bad); }

.ops { display: flex; flex-direction: column; }
.op { border-bottom: 1px solid var(--line); padding: 10px 0; }
.op:last-child { border-bottom: 0; }
.op summary { list-style: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; cursor: pointer; }
.op summary::-webkit-details-marker { display: none; }
.op .code { font-family: var(--f-head); font-weight: 700; font-size: 15px; }
.op .what { min-width: 0; } .op .what small { display: block; color: var(--muted); font-size: 12px; }
.op .pp { margin: 8px 0 0 0; padding: 0; list-style: none; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.op .pp li { display: flex; justify-content: space-between; gap: 8px; }

/* ---- skedat poshte ---- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(5, 1fr); padding-block: 4px 4px; }
.tab { background: transparent; border: 0; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--muted); font-weight: 600; border-radius: 10px; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--olive); }
.tab[aria-current="page"] svg { stroke-width: 2.2; }

/* ---- fleta poshte (bottom sheet) ---- */
.sheet { position: fixed; inset: 0; z-index: 40; }
.sheet .back { position: absolute; inset: 0; background: rgba(10, 14, 6, .45); opacity: 0; transition: opacity .18s; }
.sheet .panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; overflow: auto; background: var(--bg); border-radius: 18px 18px 0 0; transform: translateY(100%); transition: transform .22s ease; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.open .back { opacity: 1; } .sheet.open .panel { transform: none; }
.sheet .panel .wrap { padding-block: 10px 18px; display: flex; flex-direction: column; gap: 12px; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 2px auto 0; }
.stgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.stb { --c: var(--ok); text-align: left; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; box-shadow: inset 4px 0 0 var(--c); min-width: 0; }
.stb b { font-size: 14px; } .stb small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stb[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 22%, var(--surface)); border-color: var(--c); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 600; }
.field input[type=date], .field input[type=password], .field input[type=text], textarea { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; width: 100%; }
textarea { height: auto; min-height: 160px; padding: 10px 12px; font-family: ui-monospace, "Cascadia Mono", Menlo, monospace; font-size: 12px; line-height: 1.45; resize: vertical; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

/* ---- hyrja / kyçja ---- */
.gate { min-height: 100%; display: flex; align-items: flex-start; justify-content: center; }
.gate .wrap { padding-block: 28px 40px; display: flex; flex-direction: column; gap: 16px; max-width: 520px; }
.gate h1 { font-size: 30px; }
.gate .lead { font-size: 16px; color: var(--muted); max-width: 60ch; }
.filebtn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; }
.filebtn input { position: absolute; inset: 0; opacity: 0; }
.err { color: var(--bad); font-weight: 600; min-height: 1.2em; }

.toast { position: fixed; left: 50%; bottom: calc(140px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
.demo-flag { background: var(--warn); color: #1E1508; font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; padding: 2px 6px; }
@media (min-width: 700px) { .stats .v { font-size: 32px; } }
@media (prefers-reduced-motion: reduce) { .sheet .panel, .sheet .back { transition: none; } }
</style>

</head>
<body>
<div id="app">
  <header class="top" id="top" hidden>
    <div class="wrap">
      <div class="brandrow">
        <span class="badge" id="unit">KML</span>
        <div class="brand"><b id="ttl">Lista ditore</b><small id="sub"></small></div>
        <button class="icon-btn" id="menuBtn" aria-label="Menyja">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
      </div>
      <div class="datebar" id="datebar">
        <button id="dPrev" aria-label="Dita e mëparshme">‹</button>
        <label class="dlabel"><span id="dText"></span><input type="date" id="dInput" aria-label="Zgjidh datën"></label>
        <button id="dNext" aria-label="Dita tjetër">›</button>
        <button id="dToday">Sot</button>
      </div>
    </div>
  </header>
  <main id="main"></main>
  <div class="sendbar" id="sendbar" hidden><div class="wrap"><button class="btn primary" id="sendBtn">Dërgo listën te kompjuteri</button></div></div>
  <nav class="tabs" id="tabs" hidden>
    <div class="wrap">
      <button class="tab" data-tab="lista"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>Lista</button>
      <button class="tab" data-tab="raporti"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Raporti</button>
      <button class="tab" data-tab="paneli"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Paneli</button>
      <button class="tab" data-tab="efektivi"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.4 3-5.2 6-5.2s5.4 1.8 6 5.2"/><path d="M16 4.5a3 3 0 0 1 0 6M18 14.8c1.7.6 2.7 2.4 3 5.2"/></svg>Efektivi</button>
      <button class="tab" data-tab="ec"><svg viewBox="0 0 24 24"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.4 1.2-3.8 2.4-5 .2 1.6 1 2.6 2.1 3 .2-3-.5-5.6.5-8z"/></svg>EC</button>
    </div>
  </nav>
  <div class="sheet" id="sheet" hidden><div class="back" id="sheetBack"></div><div class="panel"><div class="wrap" id="sheetBody"></div></div></div>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
'use strict';
/* =====================================================================
   Prezenca KML – aplikacioni per telefon.
   Lexon kopjen rezerve te programit (Kopje_e_plote_*.zip / prezenca.xml),
   shfaq raportet dhe lejon plotesimin e listes ditore; lista dergohet te

function makeToken(date, rows) {

}
function sendText(date) {

  L.push("Organikë " + rep.orgT + " · Prezent " + rep.prezT + " · Mungojnë " + rep.mungT);

}

/* ---------------- ruajtja e sigurt ne telefon ---------------- */
const enc = new TextEncoder(), dec = new TextDecoder();

  const k = await crypto.subtle.importKey("raw", enc.encode(secret), "PBKDF2", false, ["deriveBits"]);

}
async function aesKey(secret, salt) {
  const k = await crypto.subtle.importKey("raw", enc.encode(secret), "PBKDF2", false, ["deriveKey"]);

  return new Uint8Array(await new Response(s).arrayBuffer());
}
function idbOpen() {
  return new Promise((res, rej) => {
    let r; try { r = indexedDB.open("prezenca-kml", 1); } catch (e) { rej(e); return; }
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);

async function idb(mode, fn) {

    const db = await idbOpen();

const idbGet = k => idb("readonly", s => s.get(k));
const idbPut = (k, v) => idb("readwrite", s => s.put(v, k));

let persistT = 0;
function persistSoon() { clearTimeout(persistT); persistT = setTimeout(persist, 350); }
async function persist() {
  if (S.demo || !S.db) return;
  try {
    let bytes = enc.encode(JSON.stringify({ xml: S.xml, file: S.file, loaded: S.loaded, drafts: S.drafts, sent: S.sent, sync: S.sync, outbox: S.outbox, etag: S.etag }));
    let z = false; try { const g = await gz(bytes, true); if (g) { bytes = g; z = true; } } catch (e) { }
    let rec;
    if (S.key) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      rec = { v: 1, enc: true, gz: z, salt: S.kSalt, iv: bytesToB64(iv), blob: await crypto.subtle.encrypt({ name: "AES-GCM", iv }, S.key, bytes) };
    } else rec = { v: 1, enc: false, gz: z, blob: bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength) };
    await idbPut("data", rec);
  } catch (e) { /* ruajtja ne telefon deshtoi – te dhenat mbeten ne kujtese */ }
}
async function readStored(secret) {
  const rec = await idbGet("data");
  if (!rec) return null;
  let bytes;
  if (rec.enc) {
    const tries = [secret, normCode(secret)];
    for (const t of tries) {
      if (!t) continue;
      try {
        const k = await aesKey(t, b64ToBytes(rec.salt));
        bytes = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(rec.iv) }, k, rec.blob));
        S.key = k; S.kSalt = rec.salt; S.pwUsed = t; break;
      } catch (e) { }
    }
    if (!bytes) throw new Error("Fjalëkalimi nuk është i saktë.");
  } else bytes = new Uint8Array(rec.blob);
  if (rec.gz) bytes = await gz(bytes, false);
  return JSON.parse(dec.decode(bytes));
}
function usePayload(p) {
  S.xml = p.xml; S.file = p.file || ""; S.loaded = p.loaded || ""; S.drafts = p.drafts || {}; S.sent = p.sent || {};
  S.sync = p.sync || null; S.outbox = p.outbox || []; S.etag = p.etag || null;

/* ---------------- sinkronizimi me kompjuterin (GitHub, i enkriptuar) ----------------
   Formati (i njejte me programin ne kompjuter): "PKS1" | kripa(16) | iv(16) | AES-256-CBC | HMAC-SHA256(32)
   celesat = PBKDF2-SHA256(fjalekalimi i programit, kripa, 120000) -> 64 bajte */
async function cloudKeys(secret, salt) {
  const k = await crypto.subtle.importKey("raw", enc.encode(secret), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: 120000, hash: "SHA-256" }, k, 512));
  return {
    aes: await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["encrypt", "decrypt"]),
    mac: await crypto.subtle.importKey("raw", bits.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["sign", "verify"])
  };
}
async function gunzip(b) {
  if (typeof DecompressionStream !== "undefined") {
    try { return new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer()); } catch (e) { }
  }
  let p = 10; const flg = b[3];
  if (flg & 4) p += 2 + (b[p] | (b[p + 1] << 8));
  if (flg & 8) while (b[p++]) { }
  if (flg & 16) while (b[p++]) { }
  if (flg & 2) p += 2;
  return inflateJS(b.subarray(p, b.length - 8));
}
async function cloudDecrypt(keys, blob) {
  if (blob.length < 84 || dec.decode(blob.subarray(0, 4)) !== "PKS1") throw new Error("Të dhëna të panjohura");
  const n = blob.length - 32;
  if (!await crypto.subtle.verify("HMAC", keys.mac, blob.subarray(n), blob.subarray(0, n))) throw new Error("Fjalëkalimi nuk përputhet");
  const plain = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-CBC", iv: blob.subarray(20, 36) }, keys.aes, blob.subarray(36, n)));
  return plain[0] === 1 ? await gunzip(plain.subarray(1)) : plain.subarray(1);
}
async function cloudEncrypt(keys, salt, data) {
  let flag = 0, body = data;
  try { const g = await gz(data, true); if (g) { body = g; flag = 1; } } catch (e) { }
  const plain = new Uint8Array(body.length + 1); plain[0] = flag; plain.set(body, 1);
  const iv = crypto.getRandomValues(new Uint8Array(16));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-CBC", iv }, keys.aes, plain));
  const head = new Uint8Array(36 + ct.length); head.set(enc.encode("PKS1"), 0); head.set(salt, 4); head.set(iv, 20); head.set(ct, 36);
  const mac = new Uint8Array(await crypto.subtle.sign("HMAC", keys.mac, head));
  const out = new Uint8Array(head.length + 32); out.set(head); out.set(mac, head.length);
  return out;
}
function b64uToBytes(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return b64ToBytes(s); }
function ghPath(path) { return S.sync.api.replace(/\/+$/, "") + "/repos/" + encodeURIComponent(S.sync.owner) + "/" + encodeURIComponent(S.sync.repo) + "/contents/" + path; }
async function gh(method, path, o) {
  o = o || {};
  const h = { "Authorization": "Bearer " + S.sync.token, "Accept": o.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json" };
  if (o.etag) h["If-None-Match"] = o.etag;

  return fetch(ghPath(path), { method, headers: h, body, cache: "no-store" });
}
function netErr(e) { return (navigator.onLine === false || (e && e.name === "TypeError")) ? "Pa internet – do të provohet vetë sapo të lidhet" : (e && e.message) || String(e); }
// gjendja e re nga kompjuteri
async function pull(force) {
  if (!S.sync || !S.ck || S.pulling || S.needPw) return;
  S.pulling = true;
  try {
    const r = await gh("GET", "data/snapshot.bin", { raw: true, etag: force ? null : S.etag });
    if (r.status === 304) { S.syncOk = Date.now(); S.syncErr = null; return; }
    if (r.status === 401) throw new Error("Lidhja me kompjuterin nuk vlen më. Dërgoni lidhjen e re nga programi (Cilësimet → Telefoni).");
    if (!r.ok) throw new Error("GitHub " + r.status);
    const blob = new Uint8Array(await r.arrayBuffer());
    let xml;
    try { xml = dec.decode(await cloudDecrypt(S.ck, blob)); }
    catch (e) { S.needPw = true; throw new Error("Fjalëkalimi i programit ka ndryshuar. Shkruani fjalëkalimin e ri."); }
    S.etag = r.headers.get("ETag");
    applySnapshot(xml);
    S.syncOk = Date.now(); S.syncErr = null;
  } catch (e) { S.syncErr = netErr(e); }
  finally { S.pulling = false; syncUi(); }
}
function applySnapshot(xml) {
  const db = parseDb(xml), applied = new Set(db.syncApplied), waiting = new Set(S.outbox.map(o => o.id));
  S.xml = xml; S.db = db; S.demo = false; S.file = "Sinkronizim me kompjuterin";
  for (const d of Object.keys(S.drafts)) {
    const dr = S.drafts[d], base = baseDay(d).rows;
    for (const pid of Object.keys(dr)) {
      const x = dr[pid], b = base.find(r => r.pid === +pid);
      if ((x.id && applied.has(x.id) && !waiting.has(x.id)) || (b && norm(b.s) === norm(x.s) && (b.a || null) === (x.a || null))) delete dr[pid];
    }
    if (!Object.keys(dr).length) delete S.drafts[d];
  }
  persistSoon();
  const ae = document.activeElement;
  if (ae && ae.tagName === "INPUT" && $("#main").contains(ae)) S.renderLater = true; else render();
}
// dergimi i ndryshimeve te telefonit
async function pushOutbox() {
  if (!S.sync || !S.ck || S.pushing || S.needPw || !S.outbox.length) return;
  S.pushing = true;
  try {
    const salt = b64ToBytes(S.sync.salt);
    while (S.outbox.length) {
      const it = S.outbox[0];
      const blob = await cloudEncrypt(S.ck, salt, enc.encode(JSON.stringify({ v: 1, id: it.id, date: it.date, ts: it.ts, ch: it.ch })));
      const r = await gh("PUT", "inbox/" + it.id + ".bin", { json: { message: "Telefoni: lista " + it.date, content: bytesToB64(blob) } });
      if (r.status === 401) throw new Error("Lidhja me kompjuterin nuk vlen më. Dërgoni lidhjen e re nga programi (Cilësimet → Telefoni).");
      if (!r.ok && r.status !== 422) throw new Error("GitHub " + r.status);
      S.outbox.shift();
      persistSoon();
    }
    S.syncErr = null;
  } catch (e) { S.syncErr = netErr(e); }
  finally { S.pushing = false; syncUi(); }
}

let syncSig = "";

function newId() { return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8); }
// ndryshimet e listes: ruhen ne telefon dhe (kur ka lidhje) dergohen vete te kompjuteri
function commitChanges(date, list) {
  const id = S.sync ? newId() : null, ch = [];
  for (const x of list) { setDraft(date, x.pid, x.s, x.a, id); ch.push({ p: x.pid, s: norm(x.s), a: x.s ? (x.a || null) : null }); }
  if (S.sync && ch.length) { S.outbox.push({ id, date, ts: new Date().toISOString(), ch }); persistSoon(); pushOutbox(); }
}
function syncPills(date) {
  if (!S.sync) return [];
  const out = [], dr = S.drafts[date] || {}, inOut = new Set(S.outbox.map(o => o.id));
  let unsent = 0, waiting = 0;
  for (const pid of Object.keys(dr)) { if (dr[pid].id && inOut.has(dr[pid].id)) unsent++; else waiting++; }
  if (S.needPw) out.push('<span class="pill bad">Fjalëkalimi ka ndryshuar</span>');
  else if (S.syncErr) out.push('<span class="pill warn">' + esc(S.syncErr.length > 40 ? "Pa lidhje me kompjuterin" : S.syncErr) + "</span>");
  if (unsent) out.push('<span class="pill warn">' + ndr(unsent) + " pa dërguar</span>");
  if (waiting) out.push('<span class="pill olive">' + ndr(waiting) + " në pritje të kompjuterit</span>");
  if (!unsent && !waiting && !S.syncErr && !S.needPw) out.push('<span class="pill ok">Sinkronizuar me kompjuterin</span>');

async function pairWith(code, pw) {
  const blob = b64uToBytes(code);
  let cfg = null, used = null;
  for (const t of [pw, normCode(pw)]) {
    if (!t) continue;
    try { const k = await cloudKeys(t, blob.subarray(4, 20)); cfg = JSON.parse(dec.decode(await cloudDecrypt(k, blob))); used = t; break; } catch (e) { }
  }
  if (!cfg) throw new Error("Fjalëkalimi nuk është i saktë (ose lidhja është e dëmtuar).");
  S.sync = { api: cfg.api || "https://api.github.com", owner: cfg.owner, repo: cfg.repo, token: cfg.token, salt: cfg.salt };
  S.ck = await cloudKeys(used, b64ToBytes(cfg.salt)); S.pwUsed = used; S.needPw = false;
  let r;
  try { r = await gh("GET", "data/snapshot.bin", { raw: true }); } catch (e) { S.sync = null; throw new Error("Nuk ka internet. Provoni përsëri kur telefoni të jetë i lidhur."); }
  if (!r.ok) { const st = r.status; S.sync = null; throw new Error(st === 401 ? "Tokeni i GitHub nuk vlen. Dërgoni lidhjen e re nga kompjuteri." : st === 404 ? "Të dhënat nuk u gjetën ende në GitHub. Prisni pak dhe provoni përsëri." : "GitHub " + st); }
  const xml = dec.decode(await cloudDecrypt(S.ck, new Uint8Array(await r.arrayBuffer())));
  S.etag = r.headers.get("ETag");
  S.outbox = S.outbox || []; S.drafts = S.drafts || {};
  S.loaded = new Date().toISOString();
  applySnapshot(xml);
  const salt = crypto.getRandomValues(new Uint8Array(16)); S.key = await aesKey(used, salt); S.kSalt = bytesToB64(salt);
  await persist();
  lsSet("pkml.has", "1");
  try { history.replaceState(null, "", location.pathname + location.search + "#lista"); } catch (e) { location.hash = "lista"; }
  S.tab = "lista"; S.syncOk = Date.now();
  startApp();
  toast("Telefoni u lidh me kompjuterin");
}

  const f = $("#pwForm"), inp = $("#pwIn");

  });
}
async function onFile(file) {
  try {
    const buf = new Uint8Array(await file.arrayBuffer());
    let bytes = /\.xml$/i.test(file.name) ? buf : await unzipFind(buf, n => /(^|\/)prezenca\.xml$/i.test(n));
    if (!bytes) throw new Error("Në .zip nuk u gjet prezenca.xml. Zgjidhni skedarin Kopje_e_plote_….zip nga email-i.");
    const xml = dec.decode(bytes);
    const db = parseDb(xml);
    const prevDrafts = S.drafts, prevSent = S.sent;
    const accept = async (keySecret) => {
      S.xml = xml; S.db = db; S.file = file.name; S.loaded = new Date().toISOString(); S.demo = false;
      // ndryshimet e derguara qe tashme jane te regjistruara ne kompjuter hiqen
      S.drafts = prevDrafts || {}; S.sent = prevSent || {};
      for (const d of Object.keys(S.drafts)) if (db.dayMap.has(d) && S.sent[d]) { delete S.drafts[d]; delete S.sent[d]; }
      if (keySecret) { const salt = crypto.getRandomValues(new Uint8Array(16)); S.key = await aesKey(keySecret, salt); S.kSalt = bytesToB64(salt); }
      else { S.key = null; S.kSalt = null; }
      await persist();
      lsSet("pkml.has", "1");
      startApp();
      toast("Kopja e " + (lastSaved() ? fmtD(lastSaved()) : "programit") + " u hap");
    };
    if (db.hash) {
      S.db = db;
      passwordGate("Fjalëkalimi", "Kjo kopje është e mbrojtur me fjalëkalimin e programit Prezenca KML. Pas hapjes, të dhënat ruhen në telefon të enkriptuara me të njëjtin fjalëkalim.",
        async pw => {
          if (await checkPc(pw, db.hash, db.salt)) return accept(pw);
          const c = normCode(pw);
          if (db.rhash && c && await checkPc(c, db.rhash, db.rsalt)) return accept(c);
          throw new Error("Fjalëkalimi nuk është i saktë.");
        }, '<button class="btn ghost" id="backBtn">Kthehu</button>');
      $("#backBtn").addEventListener("click", () => { S.db = null; boot(); });
    } else await accept(null);
  } catch (e) { welcome(e.message || String(e)); }
}
function lockNow() {
  if (!S.key) return;
  S.db = null; S.xml = null; S.key = null; S.drafts = {}; S.sent = {};
  closeSheet(); unlockGate();
}
function unlockGate() {
  passwordGate("Prezenca KML", "Të dhënat në këtë telefon janë të kyçura. Shkruani fjalëkalimin e programit.",
    async pw => {
      const p = await readStored(pw); usePayload(p);
      if (S.sync) { S.ck = await cloudKeys(S.pwUsed, b64ToBytes(S.sync.salt)); S.needPw = false; }
      startApp(); syncNow();
    },
    '<button class="btn ghost" id="wipeBtn">Fshi të dhënat nga ky telefon</button><div id="wipeAsk"></div>');
  $("#wipeBtn").addEventListener("click", () => {
    $("#wipeAsk").innerHTML = '<div class="banner bad"><span>Të fshihen kopja dhe ndryshimet e padërguara nga ky telefon?</span><button class="btn small" id="wipeYes">Po, fshiji</button></div>';
    $("#wipeYes").addEventListener("click", async () => { await idbDel("data"); lsSet("pkml.has", ""); S.drafts = {}; S.sent = {}; welcome(); });
  });
}

function stCell(r, date) {
  const s = norm(r.s);
  let af = "";
  if (r.a) {
    const dd = diffDays(r.a, date);
    af = `<small class="${dd < 0 ? "late" : dd <= 3 ? "soon" : ""}">deri ${fmtS(r.a)}${dd < 0 ? " · mbaroi" : ""}</small>`;
  } else if (s) { const sd = sdef(s); if (!sd || sd.afat) af = '<small class="soon">pa afat</small>'; }
  if (!s) return `<span class="st prez"><span>Prezent</span>${af}</span>`;
  return `<span class="st" style="--c:${esc(stColor(s))}"><span>${esc(s)}</span>${af}</span>`;
}

  const act = S.db.persons.filter(p => p.aktiv).sort((a, b) => a.rendi - b.rendi || a.id - b.id).filter(p => !q || plain(emri(p) + " " + p.grada + " " + p.toga + " " + p.funksioni).includes(q));
  const groups = new Map();
  for (const p of act) { const k = p.toga || "Pa caktuar"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(p); }
  const order = S.db.togat.filter(x => groups.has(x)).concat([...groups.keys()].filter(x => !S.db.togat.includes(x)));
  let html = `<div class="tools"><input class="search" id="efq" type="search" placeholder="Kërko emrin, gradën, funksionin…" value="${esc(S.efQ)}" aria-label="Kërko efektivin"></div>`;
  html += '<p class="muted" style="font-size:13px;margin:0">Gjendja sot, ' + fmtD(t) + ". Prekni një emër për kartelën.</p>";
  html += '<div class="list">' + order.map(g => {
    const ps = groups.get(g), pr = ps.filter(p => { const r = byId.get(p.id); return r && !norm(r.s); }).length;
    return `<div class="group-h"><span>${esc(g)}</span><span class="num">${pr} / ${ps.length} prezent</span></div>` + ps.map(p => {
      const r = byId.get(p.id) || { s: "", a: null };
      return `<button class="row" data-act="kartela" data-pid="${p.id}"><span class="nr"></span><span class="who"><b>${esc(emri(p))}</b><small>${esc(p.grada)}${p.funksioni ? " · " + esc(p.funksioni) : ""}</small></span>${stCell(r, t)}</button>`;
    }).join("");
  }).join("") + "</div>";
  return html;
}

function kartela(pid) {
  const p = S.db.pById.get(pid); if (!p) return;
  const t = todayISO(), r = dayRows(S.tab === "efektivi" ? t : S.date).rows.find(x => x.pid === pid) || { s: "", a: null };
  const hist = [];
  for (const d of S.db.days) for (const e of d.e) if (e.p === pid) hist.push({ d: d.d, s: (!e.s || e.s === "Prezent") ? "Prezent" : e.s, a: e.a });
  const per = [];
  for (const h of hist) { const c = per[per.length - 1]; if (c && c.s.toLowerCase() === h.s.toLowerCase()) { c.deri = h.d; c.n++; c.a = h.a; } else per.push({ s: h.s, nga: h.d, deri: h.d, n: 1, a: h.a }); }
  const y = t.slice(0, 4), counts = {};
  for (const h of hist) if (h.d.startsWith(y)) counts[h.s] = (counts[h.s] || 0) + 1;
  const ec = ecCalc(), ex = ec.pers.get(pid);
  const cnt = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([s, n]) => `<span class="pill" style="background:color-mix(in srgb, ${s === "Prezent" ? "var(--ok)" : esc(stColor(s))} 20%, var(--surface));color:var(--ink)">${esc(s)} · ${n}</span>`).join("");
  openSheet(`<div class="grab"></div>
    <div><div class="eyebrow">${esc(p.grada)} · ${esc(p.toga || "pa togë")}</div><h2 style="font-size:24px">${esc(emri(p))}</h2></div>
    <div class="card"><dl class="kv">
      <dt>Gjendja</dt><dd>${stCell(r, S.tab === "efektivi" ? t : S.date)}</dd>
      ${p.funksioni ? `<dt>Funksioni</dt><dd>${esc(p.funksioni)}</dd>` : ""}
      ${p.atesia ? `<dt>Atësia</dt><dd>${esc(p.atesia)}</dd>` : ""}
      ${p.telefoni ? `<dt>Telefoni</dt><dd><span style="user-select:all">${esc(p.telefoni)}</span> <button class="btn small" data-act="copyTel" data-v="${esc(p.telefoni)}">Kopjo</button></dd>` : ""}
      ${p.hyrja ? `<dt>Në repart nga</dt><dd>${fmtD(p.hyrja)}</dd>` : ""}
    </dl></div>
    <div class="card"><h3>Ditët e regjistruara në ${y}</h3><div class="pills" style="margin-top:8px">${cnt || '<span class="muted">Asnjë ditë e regjistruar.</span>'}</div></div>
    <div class="card"><h3>Periudhat e fundit</h3>${per.length ? '<div class="tbl-wrap"><table class="rep" style="margin-top:6px"><thead><tr><th>Statusi</th><th>Nga</th><th>Deri</th><th>Ditë</th></tr></thead><tbody>' +
      per.slice(-12).reverse().map(x => `<tr><td>${esc(x.s)}${x.a && x.s !== "Prezent" ? '<br><small class="muted">afati ' + fmtS(x.a) + "</small>" : ""}</td><td>${fmtS(x.nga)}</td><td>${fmtS(x.deri)}</td><td>${x.n}</td></tr>`).join("") + "</tbody></table></div>" : '<p class="muted">Nuk ka histori.</p>'}</div>
    <div class="card"><h3>Emergjencat Civile</h3>${ex ? `<dl class="kv" style="margin-top:6px"><dt>Ditë gjithsej</dt><dd>${ex.diteGj}</dd><dt>Ditë në periudhë</dt><dd>${ex.diteP}</dd><dt>Operacione</dt><dd>${ex.ops.size}</dd><dt>Data e fundit</dt><dd>${fmtD(ex.fundit)}${ex.neOp ? ' <span class="pill warn">në operacion</span>' : ""}</dd></dl>` : '<p class="muted">Nuk ka marrë pjesë në EC.</p>'}</div>
    <div class="actions"><button class="btn" data-act="close">Mbyll</button></div>`);
}

function viewEc() {
  const c = ecCalc();
  if (!c.ops.length) return '<div class="card"><h2>Emergjencat Civile</h2><p class="muted">Kopja nuk ka ende operacione EC. Shtoni ose importoni databazën EC në programin në kompjuter.</p></div>';
  const stPill = s => s === "Në vazhdim" ? '<span class="pill warn">Në vazhdim</span>' : s === "I planifikuar" ? '<span class="pill">I planifikuar</span>' : '<span class="pill ok">Përfunduar</span>';
  let h = `<div class="eyebrow">Periudha ${fmtD(c.N)} – ${fmtD(c.D)}</div>
    <div class="grid2">
      <div class="tile"><div class="v">${c.opNeP}</div><div class="l">Operacione në periudhë</div></div>
      <div class="tile"><div class="v">${c.dnP}</div><div class="l">Ditë-njeri në operacione</div></div>
      <div class="tile"><div class="v">${c.pjesP}</div><div class="l">Persona që kanë marrë pjesë</div></div>
      <div class="tile"><div class="v">${(c.angazh * 100).toFixed(1)}%</div><div class="l">e efektivit aktiv të angazhuar</div></div>
      <div class="tile ${c.neVazhdim.length ? "warn" : ""}"><div class="v">${c.neVazhdim.length}</div><div class="l">Operacione në vazhdim</div></div>
      <div class="tile ${c.neOpSot.length ? "warn" : ""}"><div class="v">${c.neOpSot.length}</div><div class="l">Persona në operacion sot</div></div>
    </div>`;
  if (c.neOpSot.length) h += '<div class="card"><h3>Në operacion sot</h3><div class="list" style="margin-top:8px">' + c.neOpSot.map(x => {
    const r = x.rows.find(z => z.ne);
    return `<button class="row" data-act="kartela" data-pid="${x.person.id}"><span class="nr"></span><span class="who"><b>${esc(emri(x.person))}</b><small>${esc(x.person.grada)} · ${esc(r.op.kodi)} ${esc(r.op.o.lloji)} · ${esc(r.op.o.qarku)}</small></span><span class="st" style="--c:var(--warn)"><span>dita ${diffDays(todayISO(), r.nga) + 1}</span></span></button>`;
  }).join("") + "</div></div>";
  h += '<div class="card"><h3>Operacionet</h3><div class="ops" style="margin-top:6px">' + c.ops.slice().reverse().map(o => `
    <details class="op"><summary><span class="code">${esc(o.kodi)}</span><span class="what">${esc(o.o.lloji)} · ${esc(o.o.qarku)}<small>${esc(o.o.vendi)} · ${fmtS(o.o.fillimi)}${o.fundi ? "–" + fmtS(o.fundi) : ""} · ${o.efektivi} persona · ${o.dn} ditë-njeri</small></span>${stPill(o.statusi)}</summary>
    <ul class="pp">${o.rows.map(r => `<li><span>${esc(emri(r.person))}</span><span class="muted num">${fmtS(r.nga)}–${fmtS(r.deri)} · ${r.dite} d</span></li>`).join("") || '<li class="muted">Pa pjesëmarrës</li>'}</ul></details>`).join("") + "</div></div>";
  if (c.top.length) h += '<div class="card"><h3>Më shumë ditë në EC (periudha)</h3><div class="bars" style="margin-top:10px">' + c.top.map(x =>
    `<div class="bar-row"><span class="lab">${esc(emri(x.person))}</span><span class="val">${x.diteP} ditë · ${x.opsP.size} op.</span><div class="bar"><i class="amt" style="width:${Math.round(x.diteP * 100 / c.top[0].diteP)}%"></i></div></div>`).join("") + "</div></div>";
  return h;
}

/* ---------------- fletet poshte ---------------- */
function openSheet(html) {
  clearTimeout(closeSheet.t);
  const sh = $("#sheet");
  $("#sheetBody").innerHTML = html;
  sh.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => sh.classList.add("open")));
}
function closeSheet() {
  const sh = $("#sheet");
  if (sh.hidden) return;
  sh.classList.remove("open");
  closeSheet.t = setTimeout(() => { sh.hidden = true; $("#sheetBody").innerHTML = ""; }, 220);
}

function editSheet(pids) {
  const d = S.date, rows = dayRows(d).rows.filter(r => pids.includes(r.pid));
  if (!rows.length) return;
  const one = rows.length === 1 ? rows[0] : null;
  let cur = one ? norm(one.s) : null, af = one ? one.a : null;
  const opts = [{ kodi: "", pershkrimi: "Prezent", ngjyra: "var(--ok)" }].concat(S.db.statuset);
  openSheet(`<div class="grab"></div>
    <div>${one ? `<div class="eyebrow">${esc(one.grada)} · ${esc(togaOf(one.pid) || "")}</div><h2 style="font-size:22px">${esc(emri(one))}</h2>` : `<h2 style="font-size:22px">${rows.length} efektivë të zgjedhur</h2><p class="muted" style="margin:4px 0 0">${esc(rows.slice(0, 6).map(r => inicial(r.emri, r.mbiemri)).join(", "))}${rows.length > 6 ? "…" : ""}</p>`}</div>
    <div class="stgrid" id="stgrid">${opts.map(s => `<button class="stb" data-s="${esc(s.kodi)}" style="--c:${esc(s.ngjyra)}" aria-pressed="${cur !== null && cur.toLowerCase() === s.kodi.toLowerCase()}"><b>${esc(s.kodi || "Prezent")}</b><small>${esc(s.pershkrimi)}</small></button>`).join("")}</div>
    <div class="sheet-foot"><div class="field" id="afBox"><label for="afIn">Afati (deri më) <span id="afReq"></span></label>
      <input type="date" id="afIn" value="${esc(af || "")}">
      <div class="quick">${[1, 3, 7, 14, 30].map(n => `<button class="btn small" data-q="${n}">+${n} ditë</button>`).join("")}<button class="btn small" data-q="0">Pa afat</button></div></div>
    <div class="actions"><button class="btn" data-act="close">Anulo</button><button class="btn primary" id="saveSt">Ruaj</button></div></div>`);
  const body = $("#sheetBody"), afIn = $("#afIn");
  const upd = () => {
    const sd = sdef(cur);
    $("#afReq").textContent = cur === null ? "" : !cur ? "(prezent – pa afat)" : (sd && !sd.afat) ? "(opsional)" : "(kërkohet)";
    $("#afBox").style.opacity = cur === "" ? .45 : 1;
    for (const b of body.querySelectorAll(".stb")) b.setAttribute("aria-pressed", cur !== null && b.dataset.s.toLowerCase() === cur.toLowerCase());
  };
  upd();
  body.querySelector("#stgrid").addEventListener("click", e => { const b = e.target.closest(".stb"); if (!b) return; cur = b.dataset.s; if (!cur) afIn.value = ""; upd(); });
  body.querySelector(".quick").addEventListener("click", e => { const b = e.target.closest("[data-q]"); if (!b) return; const n = +b.dataset.q; afIn.value = n ? addDays(d, n) : ""; if (cur === "" && n) { cur = null; } upd(); });
  $("#saveSt").addEventListener("click", () => {
    if (cur === null) { if (!one) { toast("Zgjidhni statusin"); return; } cur = norm(one.s); }
    const a = cur ? (afIn.value || null) : null;
    commitChanges(d, rows.map(r => ({ pid: r.pid, s: cur, a: a })));
    S.sel.clear(); S.selMode = false;
    closeSheet(); render();
    const sd = sdef(cur);
    if (cur && !a && (!sd || sd.afat)) toast("U ruajt – mos harroni afatin"); else toast("U ruajt në telefon");
  });
}

function sendSheet() {
  const d = S.date, text = sendText(d), to = S.db.emailTe;
  const subj = "Lista ditore " + S.db.njesia + " " + fmtD(d);
  openSheet(`<div class="grab"></div>
    <div><div class="eyebrow">${esc(dita(d))}, ${fmtD(d)}</div><h2 style="font-size:22px">Dërgo listën te kompjuteri</h2></div>
    <ol class="steps">
      <li>Shtypni <b>Kopjo tekstin</b>.</li>
      <li>Hapni email-in, shkruani një mesazh të ri për veten${to ? ` (<span style="user-select:all">${esc(to)}</span>)` : ""}, ngjitni tekstin dhe dërgojeni.</li>
      <li>Në kompjuter: <b>Lista ditore → Nga telefoni</b>, ngjitni tekstin e email-it, kontrolloni listën dhe shtypni <b>Ruaj ditën</b>.</li>
    </ol>
    <textarea id="sendTxt" readonly aria-label="Teksti për email">${esc(text)}</textarea>
    <div class="actions">
      ${to ? `<a class="btn" href="mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(text)}">Hap email-in</a>` : ""}
      <button class="btn" data-act="markSent">E dërgova</button>
      <button class="btn primary" id="copyBtn">Kopjo tekstin</button>
    </div>
    <p class="muted" style="font-size:12px;margin:0">Kodi në fund (PKML1…) e lexon programi; mos e ndryshoni. Mund ta dërgoni edhe me WhatsApp/Viber te vetja.</p>`);
  $("#copyBtn").addEventListener("click", () => {
    const ta = $("#sendTxt");
    const fallback = () => { ta.focus(); ta.select(); try { ta.setSelectionRange(0, ta.value.length); } catch (e) { } toast("Teksti u zgjodh – shtypni Copy"); };
    try { navigator.clipboard.writeText(text).then(() => toast("Teksti u kopjua"), fallback); } catch (e) { fallback(); }
  });
}

function menuSheet() {
  const ls = S.db ? lastSaved() : null;
  openSheet(`<div class="grab"></div>
    <h2 style="font-size:22px">${esc(S.db.emri || S.db.njesia)}</h2>
    <div class="card"><dl class="kv">
      <dt>Kopja</dt><dd>${S.demo ? "Të dhëna shembull" : esc(S.file || "")}</dd>
      ${ls ? `<dt>Dita e fundit e ruajtur</dt><dd>${fmtD(ls)}</dd>` : ""}
      <dt>Efektivi aktiv</dt><dd>${S.db.persons.filter(p => p.aktiv).length}</dd>
      <dt>Mbrojtja</dt><dd>${S.demo ? "–" : S.key ? "Të dhënat në telefon janë të enkriptuara me fjalëkalimin e programit" : "Programi në kompjuter nuk ka fjalëkalim; të dhënat në telefon nuk janë të kyçura"}</dd>
    </dl></div>
    ${S.sync ? `<div class="card"><h3>Sinkronizimi me kompjuterin</h3><dl class="kv" style="margin-top:6px">
      <dt>Gjendja</dt><dd>${S.needPw ? "Duhet fjalëkalimi i ri" : S.syncErr ? esc(S.syncErr) : "Në rregull"}</dd>
      <dt>Ruajtja e fundit në kompjuter</dt><dd>${S.db.syncKoha ? esc(S.db.syncKoha.replace("T", " ").slice(0, 16)) : "–"}</dd>
      <dt>Kontrolli i fundit</dt><dd>${S.syncOk ? new Date(S.syncOk).toLocaleTimeString("sq-AL", { hour: "2-digit", minute: "2-digit" }) : "–"}</dd>
      <dt>Ndryshime pa dërguar</dt><dd>${S.outbox.length}</dd></dl>
      <div class="actions" style="justify-content:flex-start;margin-top:10px"><button class="btn primary" data-act="syncNow">Rifresko tani</button>${S.needPw ? '<button class="btn" data-act="newPw">Shkruaj fjalëkalimin</button>' : ""}<button class="btn" data-act="unpair">Shkëput</button></div><div id="unpairAsk"></div></div>` : ""}
    <label class="btn${S.sync ? "" : " primary"} filebtn" style="height:46px">Ngarko kopjen e re (.zip)<input type="file" id="fileIn2" accept=".zip,.xml,application/zip"></label>
    ${S.key ? '<button class="btn" data-act="lock" style="height:46px">Kyç tani</button>' : ""}
    ${S.demo ? '<button class="btn" data-act="exitDemo" style="height:46px">Dil nga shembulli</button>' : '<button class="btn" data-act="wipe" style="height:46px">Fshi të dhënat nga ky telefon</button><div id="wipeAsk2"></div>'}
    <p class="muted" style="font-size:13px;margin:0">${S.sync ? "Telefoni rifreskohet vetë sa herë ruani në kompjuter, dhe ndryshimet e listës këtu ruhen vetë në kompjuter (kur programi është i hapur dhe ka internet)." : "Çdo ditë programi në kompjuter ju dërgon me email kopjen e plotë. Ngarkojeni këtu për të parë gjendjen e fundit. Ndryshimet që bëni te Lista dërgohen te kompjuteri me \"Dërgo listën te kompjuteri\"."}</p>
    ${S.sync ? '<button class="btn" data-act="manualSend" style="height:42px">Dërgo listën me email (pa sinkronizim)</button>' : ""}
    <div class="actions"><button class="btn" data-act="close">Mbyll</button></div>`);
  $("#fileIn2").addEventListener("change", e => { const f = e.target.files[0]; if (f) { closeSheet(); onFile(f); } });
}

/* ---------------- ngjarjet ---------------- */
document.addEventListener("click", e => {
  const tb = e.target.closest(".tab"); if (tb) { setTab(tb.dataset.tab); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, pid = +b.dataset.pid;
  switch (a) {
    case "edit": editSheet([pid]); break;
    case "sel": if (S.sel.has(pid)) S.sel.delete(pid); else S.sel.add(pid); render(); break;
    case "selMode": S.selMode = !S.selMode; S.sel.clear(); render(); break;
    case "toga": S.toga = b.dataset.t; render(); break;
    case "kartela": kartela(pid); break;
    case "close": closeSheet(); break;
    case "clearExpired": { const d = S.date; commitChanges(d, dayRows(d).rows.filter(r => r.a && r.a < d && norm(r.s)).map(r => ({ pid: r.pid, s: "", a: null }))); render(); toast("Statuset me afat të mbaruar u hoqën"); break; }
    case "markSent": S.sent[S.date] = tokenHash(S.date); persistSoon(); closeSheet(); render(); toast("Shënuar si e dërguar"); break;
    case "reload": menuSheet(); break;
    case "lock": lockNow(); break;
    case "exitDemo": closeSheet(); S.db = null; S.demo = false; welcome(); break;
    case "wipe":
      $("#wipeAsk2").innerHTML = '<div class="banner bad"><span>Të fshihen kopja dhe ndryshimet e padërguara nga ky telefon?</span><button class="btn small" data-act="wipeYes">Po, fshiji</button></div>'; break;
    case "wipeYes": idbDel("data").then(() => { lsSet("pkml.has", ""); S.db = null; S.key = null; S.drafts = {}; S.sent = {}; S.sync = null; S.ck = null; S.outbox = []; closeSheet(); welcome(); }); break;
    case "newPw": askNewPassword(); break;
    case "syncNow": closeSheet(); toast("Duke rifreskuar…"); syncNow(true); break;
    case "manualSend": closeSheet(); setTimeout(sendSheet, 250); break;
    case "unpair": $("#unpairAsk").innerHTML = '<div class="banner bad"><span>Telefoni nuk do të rifreskohet më nga kompjuteri.</span><button class="btn small" data-act="unpairYes">Po, shkëput</button></div>'; break;
    case "unpairYes": S.sync = null; S.ck = null; S.outbox = []; persist(); closeSheet(); render(); toast("Telefoni u shkëput"); break;
    case "copyTel": try { navigator.clipboard.writeText(b.dataset.v).then(() => toast("Numri u kopjua"), () => toast(b.dataset.v)); } catch (err) { toast(b.dataset.v); } break;
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (x) { } } }
  if (e.target.id === "efq") { S.efQ = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#efq"); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (x) { } } }
});
$("#sheetBack").addEventListener("click", closeSheet);
$("#menuBtn").addEventListener("click", () => { if (S.db) menuSheet(); });
$("#dPrev").addEventListener("click", () => setDate(addDays(S.date, -1)));
$("#dNext").addEventListener("click", () => setDate(addDays(S.date, 1)));
$("#dToday").addEventListener("click", () => setDate(todayISO()));
$("#dInput").addEventListener("change", e => setDate(e.target.value));
$("#sendBtn").addEventListener("click", () => {
  if (S.selMode) { if (S.sel.size) editSheet([...S.sel]); return; }
  sendSheet();
});
window.addEventListener("hashchange", () => { const h = location.hash.replace("#", ""); if (S.db && TABS.includes(h) && h !== S.tab) { S.tab = h; render(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
// kyçja automatike pas 5 minutash ne sfond
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { S.hiddenAt = Date.now(); persist(); }
  else if (S.key && S.hiddenAt && Date.now() - S.hiddenAt > 5 * 60 * 1000) lockNow();
  else if (S.sync && S.ck) syncNow();
});
// rifreskimi automatik me kompjuterin
setInterval(() => { if (!document.hidden && S.sync && S.ck) syncNow(); }, 20000);
window.addEventListener("online", () => { if (S.sync && S.ck) syncNow(); });
document.addEventListener("focusout", () => { if (S.renderLater) setTimeout(() => { const ae = document.activeElement; if (!(ae && ae.tagName === "INPUT" && $("#main").contains(ae))) { S.renderLater = false; render(); } }, 50); });

async function boot() {
  if (window.__PKML_TEST) { await window.__PKML_TEST(); return; }
  const pair = codeFromText(location.hash.startsWith("#lidh=") ? location.hash : "");
  let rec = null;
  try { rec = await idbGet("data"); } catch (e) { rec = null; }
  if (pair) { pairGate(pair); return; }
  if (rec && rec.enc) { unlockGate(); return; }
  if (rec) { try { usePayload(await readStored("")); startApp(); return; } catch (e) { } }
  if (HOSTED) welcome(); else loadDemo();
}
boot();
</script>

<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () { }); }</script>
</body>
